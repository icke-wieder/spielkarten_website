<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eintragung</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="container">


        <!-- =====================================
             DEINE EINSTELLUNGEN
             ===================================== -->

        <img
            id="mainImage"
            src="preview.png"
            alt="Bild"
        >

        <p id="explanation"></p>


        <!-- =====================================
             FORTSCHRITTSBALKEN
             ===================================== -->

        <section class="progress-section">
        
            <div class="progress-info">
        
                <span>Aktuelle Anzahl:</span>
        
                <strong>
                    <span id="totalAmount">...</span> / 75
                </strong>
        
            </div>

            <div class="progress-container">
        
                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>
        

        
            </div>
            
        
        </section>


        <!-- =====================================
             FORMULAR
             ===================================== -->

        <form id="form">


            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Dein Name"
                required
            >


            <label for="email">
                Mailadresse oder Handynummer
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Mail oder Nummer"
                required
            >


            <label for="amount">
                Anzahl
            </label>

            <select
                id="amount"
                name="amount"
                required
            >

                <option
                    value=""
                    disabled
                    selected
                >
                    Bitte auswählen
                </option>

                <option value="1">
                    1
                </option>

                <option value="2">
                    2
                </option>

                <option value="3">
                    3
                </option>

                <option value="4">
                    4
                </option>

                <option value="5">
                    5
                </option>

                <option value="5+">
                    5+
                </option>

            </select>


            <button type="submit">
                Eintragen
            </button>

        </form>


        <div id="message"></div>


        <!-- =====================================
             WEITERE BILDER
             ===================================== -->

        <section
            id="moreImages"
            class="more-images"
        ></section>


    </main>


    <script>


        // ========================================
        // DEINE EINSTELLUNGEN | Hier steht Text
        // ========================================

        const image = "preview.png";

        // const text = "~ Erklärung was genau ich hier eigentlich mache ~";

        const text = "So, was ist das hier überhaupt? Ich hab Lust gehabt meine eigenen Spielkarten zu designen und hier sind wir, das kam bei der ganzen Aktion raus. Es ist ein Pokerset, dass heißt es gibt 52 Karten (von 2 bis Ass für vier Farben). Und jetzt war ich am überlegen die einfach für Freunde, Familie und Bekannte in einer größeren Menge drucken zu lassen und sie dadurch günstiger verticken kann. Um genauer zu sein: Einzeln Sets zu kaufen, kostet 20€ + Versand und in großer Stückzahl wären es 'nur' noch 12-15€ + Versand (Ich kann es noch nicht genau sagen, gibt am Ende ein spezifisches Angebot von der Druckerei). So und jetzt ist halt die Frage: Besteht überhaupt Interesse, also könnt ihr hier gerne euch eintragen - ist noch nicht verbindlich - ich will mir einfach mal ein grobes Bild verschaffen. \n Falls ihr Freunde von Freunden seid, brauche ich halt irgendeine Form am Ende Kontakt aufnehmen zu können, deshalb das Mail/Nummer Feld, aber keine Sorge, dass brauche ich erst, wenn die Grenze von 75 Stück erreicht wurde. \n Ich kann auch nicht garantieren, dass die Farben am Ende GENAU so aussehen werden, wie hier auf der Website, aber das ist ja klar. Den Rand von den Karten werde ich aber wahrscheinlich noch weiß machen und nicht rosa/beige, aber das weiß ich noch nicht so genau. \n\n\n\n Falls ihr Fragen habt, könnt ihr mir einfach schreiben: ";

        const profile = <a href="https://instagram.com/icke__wieder">instagram.com/icke__wieder</a>

        const scriptURL =
            "https://script.google.com/macros/s/AKfycbyBmYXcE37LlEs5VxtjBWGpOojbPlZeKpjEmsFAb3wwdGkOe0FCTKHF9QVW_61pYrnP/exec";


        // Deine GitHub-Daten
        const githubUser = "icke-wieder";
        const githubRepo = "spielkarten_website";


        // ========================================
        // EINSTELLUNGEN ANWENDEN
        // ========================================

        document.getElementById("mainImage").src = image;

        document.getElementById("explanation").textContent = text;
        document.getElementById("profile").textContent = profile;


        // ========================================
        // FORTSCHRITT LADEN
        // ========================================

        async function loadProgress() {

            try {

                const response =
                    await fetch(scriptURL);

                const data =
                    await response.json();

                const total =
                    Number(data.total) || 0;


                document.getElementById(
                    "totalAmount"
                ).textContent = total;


                // 50 ist das Ziel für 100 %
                // Alles darüber bleibt bei 100 %

                const percentage =
                    Math.min((total / 50) * 100, 100);


                document.getElementById(
                    "progressBar"
                ).style.width =
                    percentage + "%";


            } catch (error) {

                console.error(
                    "Fehler beim Laden des Fortschritts:",
                    error
                );

                document.getElementById(
                    "totalAmount"
                ).textContent = "?";

            }

        }


        // Beim Laden der Seite
        loadProgress();


        // ========================================
        // FORMULAR
        // ========================================

        const form =
            document.getElementById("form");

        const message =
            document.getElementById("message");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "name"
                    ).value;


                const email =
                    document.getElementById(
                        "email"
                    ).value;


                const amount =
                    document.getElementById(
                        "amount"
                    ).value;


                message.textContent =
                    "Wird eingetragen ...";

                message.className =
                    "loading";


                try {

                    const formData =
                        new URLSearchParams();


                    formData.append(
                        "name",
                        name
                    );


                    formData.append(
                        "email",
                        email
                    );


                    formData.append(
                        "amount",
                        amount
                    );


                    await fetch(
                        scriptURL,
                        {
                            method: "POST",
                            body: formData,
                            mode: "no-cors"
                        }
                    );


                    form.reset();


                    message.textContent =
                        "Danke! Deine Antwort wurde eingetragen. ❤️";

                    message.className =
                        "success";


                    // Fortschrittsbalken aktualisieren
                    loadProgress();


                } catch (error) {

                    console.error(error);


                    message.textContent =
                        "Leider ist etwas schiefgegangen. Bitte versuche es noch einmal.";

                    message.className =
                        "error";

                }

            }
        );


        // ========================================
        // BILDER AUS more_img/ LADEN
        // ========================================

        async function loadMoreImages() {

            const container =
                document.getElementById(
                    "moreImages"
                );


            try {

                const response =
                    await fetch(
                        `https://api.github.com/repos/${githubUser}/${githubRepo}/contents/more_img`
                    );


                if (!response.ok) {
                    throw new Error(
                        "Ordner konnte nicht geladen werden."
                    );
                }


                const files =
                    await response.json();


                files
                    .filter(file =>
                        file.type === "file" &&
                        /\.(png|jpg|jpeg|gif|webp)$/i.test(file.name)
                    )
                    .forEach(file => {

                        const img =
                            document.createElement(
                                "img"
                            );


                        img.src =
                            file.download_url;


                        img.alt =
                            file.name;


                        container.appendChild(
                            img
                        );

                    });


            } catch (error) {

                console.error(
                    "Fehler beim Laden der Bilder:",
                    error
                );

            }

        }


        loadMoreImages();


    </script>

</body>

</html>
